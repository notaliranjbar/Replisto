[project]
name = "replisto"
version = "0.1.0"
description = "Replisto: AI assistant that answers Instagram DMs for online shops"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
# User-facing Persian copy and the LLM prompt read better unwrapped.
"app/services/knowledge.py" = ["E501"]
"app/services/responder.py" = ["E501"]
"app/services/products.py" = ["E501"]
"app/services/teach.py" = ["E501"]
"app/services/telegram_bot.py" = ["E501"]
"app/services/billing.py" = ["E501"]
"app/services/notify.py" = ["E501"]
