services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
    # Story photos and videos waiting to be published (Instagram downloads them from the API).
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
    depends_on:
      - api

  # Database backups every few hours into ./backups (+ an encrypted off-site copy in the
  # operations Telegram chat when BACKUP_PASSPHRASE is set). See deploy/backup/RESTORE.md.
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # HTTPS entry point: the shop panel (built from ./frontend) and a proxy to the API.
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:?set SUPPORT_EMAIL in .env}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
    volumes:
      - caddydata:/data
    depends_on:
      - api

volumes:
  pgdata:
  media:
  redisdata:
  caddydata:
