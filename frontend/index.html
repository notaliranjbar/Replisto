<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d7d70" />
    <!-- apply the saved light/dark theme before first paint (see src/theme.tsx) -->
    <script>
      try {
        var t = localStorage.getItem("dm.theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
      try {
        var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("dm.lang");
        if (l === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Replisto answers your customers' Instagram messages in seconds, day and night, using only your products and prices, and hands you what it doesn't know. Pay only for answers." />
    <meta property="og:title" content="Replisto — AI that answers your Instagram DMs" />
    <meta property="og:description" content="Every DM answered, in seconds. Pay only for answers." />
    <meta property="og:image" content="/brand/replisto-logo-512.png" />
    <title>Replisto — AI that answers your Instagram DMs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
