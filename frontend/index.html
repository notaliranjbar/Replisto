<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6b2de8" />
    <!-- apply the saved light/dark theme before first paint (see src/theme.tsx) -->
    <script>
      try {
        var t = localStorage.getItem("dm.theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
      try {
        var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("dm.lang");
        if (l === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Replisto is an AI agent for your business: it talks to your customers using your own info and products, helps with sales and support, and works on your messaging channels." />
    <meta property="og:title" content="Replisto — AI agent for your business" />
    <meta property="og:description" content="Your business's smart teammate: sales, support, advice and customer follow-up." />
    <meta property="og:image" content="/brand/replisto-logo-512.png" />
    <title>Replisto — AI agent for your business</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
