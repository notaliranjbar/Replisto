<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2548e0" />
    <!-- apply the saved light/dark theme before first paint (see src/theme.tsx) -->
    <script>
      try {
        var t = localStorage.getItem("dm.theme");
        if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
      try {
        var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("dm.lang");
        if (l === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Replisto answers your customers' Instagram messages and comments in seconds, using only your products and prices, publishes your stories on time, and turns your page's numbers into content ideas. Pay only for what you use." />
    <meta property="og:title" content="Replisto — AI assistant for Instagram DMs, comments and stories" />
    <meta property="og:description" content="Your smartest employee, never off the clock. Answers DMs and comments, posts your stories, reads your numbers." />
    <meta property="og:image" content="/brand/replisto-logo-512.png" />
    <title>Replisto — AI assistant for Instagram DMs, comments and stories</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- If the app can't start (a very old browser), say so instead of showing a blank page. -->
    <div id="boot-fallback" hidden style="max-width:28rem;margin:4rem auto;padding:0 1rem;font-family:system-ui,sans-serif;text-align:center;color:#1d2939;line-height:1.7">
      <p style="font-size:1.125rem;font-weight:600">Replisto</p>
      <p>This page needs a newer browser. Please update Chrome or Safari, or open the link in another browser.</p>
      <p dir="rtl">تحتاج هذه الصفحة إلى متصفح أحدث. يرجى تحديث Chrome أو Safari، أو فتح الرابط في متصفح آخر.</p>
    </div>
    <script>
      (function () {
        function showFallback() {
          var root = document.getElementById("root");
          if (root && !root.firstChild) document.getElementById("boot-fallback").hidden = false;
        }
        window.addEventListener("error", function () { setTimeout(showFallback, 0); });
        setTimeout(showFallback, 8000);
      })();
    </script>
    <script nomodule>
      document.getElementById("boot-fallback").hidden = false;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
